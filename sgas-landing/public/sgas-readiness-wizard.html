<script>
(function(){

  var gl=c.getContext('webgl')||c.getContext('experimental-webgl');if(!gl)return;

  var fs='precision highp float;varying vec2 v;uniform float u;void main(){float p=sin(u*.5)*.5+.5;vec3 col=vec3(.039,.122,.078);float n=fract(sin(dot(v,vec2(12.9898,78.233)))*43758.5453);col+=n*.02;float g=1.-length(v-vec2(.5));col+=vec3(.114,.62,.459)*pow(g,3.)*.05*p;gl_FragColor=vec4(col,1.);}';
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var pos=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
  var ut=gl.getUniformLocation(pr,'u');
  function r(t){if(typeof ResizeObserver==='undefined')ss();gl.viewport(0,0,c.width,c.height);if(ut)gl.uniform1f(ut,t*.001);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(r);}
  r(0);
})();
</script>

var MAILTO_CTA = 'mailto:geral@hsilva.org?subject=SGAS%20Pro%20%E2%80%94%20upgrade%20plano%20completo';

var TRIAL_DAYS = 3, DAY_MS = 86400000;

/* ── Supabase ──────────────────────────────────────────────── */
var _sb = null;
function getClient() {
  if (window.SGAS_AUTH && window.SGAS_AUTH.client) return window.SGAS_AUTH.client;
  if (_sb) return _sb;
  if (!window.supabase || !window.supabase.createClient) return null;
  var cfg = window.SGAS_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return null;
  _sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
  return _sb;
}
async function detectPlan() {
  try {
    var sb = getClient(); if (!sb) return;
    var session = (await sb.auth.getSession()).data.session; if (!session) return;
    var r = await sb.from('organization_members')
      .select('organization_id, organizations(trial_ends_at, entitlement, created_at)')
      .eq('user_id', session.user.id).is('suspended_at', null).limit(1).maybeSingle();
    if (r.data && r.data.organizations) {
      var org = r.data.organizations;
      if (org.entitlement === 'paid' || !org.trial_ends_at) { PLAN = 'paid'; TRIAL_ENDS_AT = null; return; }
      PLAN = 'trial';
      var created = org.created_at ? new Date(org.created_at) : new Date();
      var maxEnd = new Date(created.getTime() + TRIAL_DAYS * DAY_MS);
      var expEnd = org.trial_ends_at ? new Date(org.trial_ends_at) : null;
      TRIAL_ENDS_AT = expEnd && !isNaN(expEnd) ? new Date(Math.min(expEnd.getTime(), maxEnd.getTime())) : maxEnd;
    }
  } catch(_) {}
}

/* ── Helpers ───────────────────────────────────────────────── */
function t(key) { return (T[LANG] && T[LANG][key]) || T.pt[key] || key; }
function psName(c) { return PS[c][LANG] || PS[c].pt; }
function psRat(c) { return PS_RATIONALE[c][LANG] || PS_RATIONALE[c].pt; }
function h(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isTrial() { return PLAN !== 'paid'; }
function entitlementAllows(ps) { return !isTrial() || TRIAL_PS.includes(ps); }
function activeQuestions() { return Q.filter(function(q){ return !(q.cond && !STATE.screen[q.cond]); }); }
function activeQuestionsForPS(ps) { return activeQuestions().filter(function(q){ return q.ps === ps; }); }
function applicablePS() {
  var r = ['PS1','PS2','PS3','PS4'];
  [{ps:'PS5',sc:'sc5'},{ps:'PS6',sc:'sc6'},{ps:'PS7',sc:'sc7'},{ps:'PS8',sc:'sc8'}]
    .forEach(function(c){ if (STATE.screen[c.sc]) r.push(c.ps); });
  return r;
}
function globalQIndex(ps, li) {
  var all = activeQuestions(), count = 0;
  for (var i = 0; i < all.length; i++) {
    if (all[i].ps === ps) { if (count === li) return i; count++; }
  }
  return -1;
}

/* ── Scoring ───────────────────────────────────────────────── */
function scoreVal(v) { if(v==='yesE')return 1;if(v==='yes')return .7;if(v==='prog')return .3;if(v==='no')return 0;return null; }
function scorePS(ps) {
  var qs = activeQuestionsForPS(ps); if (!qs.length) return null;
  var sc = [], tot = 0;
  qs.forEach(function(q,li){ var gi=globalQIndex(ps,li); var ans=STATE.answers[gi]; var s=ans?scoreVal(ans.val):null; if(s!==null){sc.push(s);tot+=s;} });
  return sc.length ? Math.round((tot/sc.length)*100) : null;
}
function globalScore() {
  var app = applicablePS().filter(entitlementAllows), sc = [], tot = 0;
  app.forEach(function(ps){ var s=scorePS(ps); if(s!==null){sc.push(s);tot+=s;} });
  return sc.length ? Math.round(tot/sc.length) : null;
}
function criticalGaps() {
  var gaps = [];
  activeQuestions().forEach(function(q,gi){
    if (!q.crit || !entitlementAllows(q.ps)) return;
    var ans = STATE.answers[gi]; var s = ans ? scoreVal(ans.val) : 0;
    if (s === null) return;
    if (s < 1) gaps.push({ps:q.ps, ref:q.ref, text:q[LANG]||q.pt, val:ans?ans.val:'no'});
  });
  return gaps;
}
function profileJSON() {
  var app = applicablePS();
  return {
    wizard_version:'1.0', plan:PLAN, lang:LANG, assessed_at:new Date().toISOString(),
    project:STATE.project, applicable_standards:app,
    screened_out:PS_ORDER.filter(function(p){return !app.includes(p);}),
    screen_answers:STATE.screen, score:globalScore(),
    scores_by_ps:(function(){ var o={}; app.forEach(function(ps){o[ps]=entitlementAllows(ps)?scorePS(ps):null;}); return o; })(),
    critical_gaps:criticalGaps(), answers:STATE.answers,
    status:STATE.completed?'complete':'partial'
  };
}

/* ── Persistence ───────────────────────────────────────────── */
var _saveTimer = null;
function scheduleSave(d) { clearTimeout(_saveTimer); _saveTimer = setTimeout(saveAssessment, d||1500); }

async function saveAssessment() {
  var sb = getClient(); if (!sb) return;
  try {
    setSaveState('saving');
    var session = (await sb.auth.getSession()).data.session;
    if (!session) { setSaveState(''); return; }
    var mr = await sb.from('organization_members').select('organization_id')
      .eq('user_id',session.user.id).is('suspended_at',null).limit(1).maybeSingle();
    if (!mr.data) { setSaveState(''); return; }
    var orgId = mr.data.organization_id;
    var params = new URLSearchParams(window.location.search);
    var projId = params.get('project_id') || localStorage.getItem('sgas_project_id');
    var profile = profileJSON();
    var payload = {
      org_id:orgId, project_id:projId||null, plan:PLAN, lang:LANG,
      status:STATE.completed?'complete':'partial', score:profile.score,
      applicable_standards:profile.applicable_standards, critical_gaps:profile.critical_gaps,
      answers:STATE.answers, profile:profile, updated_at:new Date().toISOString()
    };
    var res = await sb.from('readiness_assessments')
      .upsert(payload,{onConflict:'org_id,lang',ignoreDuplicates:false}).select().maybeSingle();
    if (res.error && res.error.code !== '42P01') {
      console.warn('[SGAS Wizard] Save error:', res.error.message); setSaveState('');
    } else {
      setSaveState('saved'); setTimeout(function(){ setSaveState('idle'); }, 3000);
      updateProjectConfig(profile, res.data||null);
    }
  } catch(e) { console.warn('[SGAS Wizard] Save exception:', e.message); setSaveState(''); }
}

function setSaveState(state) {
  var el = document.getElementById('saveIndicator');
  if (!el) return;
  if (!state) { el.style.display='none'; return; }
  el.style.display = 'inline';
  if (state==='saving') { el.textContent = LANG==='en'?'SAVING…':LANG==='fr'?'SAUVEGARDE…':'A GUARDAR…'; el.style.color='#E0A84B'; }
  else if (state==='saved') { el.textContent = LANG==='en'?'SAVED ✓':LANG==='fr'?'SAUVEGARDÉ ✓':'GUARDADO ✓'; el.style.color='#68dbae'; }
  else { el.textContent = t('autosave'); el.style.color='#87948c'; }
}

function updateProjectConfig(profile, row) {
  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({type:'sgas-readiness-saved',profile:profile,row:row}, window.location.origin); } catch(_){}
  }
  if (window.opener && window.opener.ACTIVE_PROJECT_ID) {
    try {
      var sb = getClient(); if (!sb) return;
      sb.from('projects').update({metadata:{readiness_score:profile.score,applicable_standards:profile.applicable_standards,critical_gaps:profile.critical_gaps,last_assessment_at:profile.assessed_at}}).eq('id',window.opener.ACTIVE_PROJECT_ID).then(function(){});
    } catch(_){}
  }
}

/* ── Score header ──────────────────────────────────────────── */
function updateScoreHeader() {
  var score = globalScore();
  var counter = document.getElementById('scoreCounter');
  var pct = document.getElementById('scorePct');
  var bar = document.getElementById('progressBarFill');
  var badge = document.getElementById('critBadge');
  var badgeTxt = document.getElementById('critBadgeText');
  var lbl = document.getElementById('scoreLabel');
  if (lbl) lbl.textContent = t('meter');
  if (score === null) {
    if (counter) counter.textContent = '—';
    if (pct) pct.textContent = '';
    if (bar) bar.style.width = '0%';
    if (badge) badge.style.display = 'none';
  } else {
    if (counter) {
      var prev = parseInt(counter.textContent)||0;
      if (prev !== score) {
        var s0=prev, s1=score, dur=400, t0=performance.now();
        (function tick(now){ var p=Math.min((now-t0)/dur,1); counter.textContent=Math.floor(s0+(s1-s0)*p); if(p<1)requestAnimationFrame(tick); else { counter.textContent=s1; counter.classList.remove('pulse-animate'); void counter.offsetWidth; counter.classList.add('pulse-animate'); } })(t0);
      }
    }
    if (pct) pct.textContent = '%';
    if (bar) bar.style.width = score + '%';
    var crits = criticalGaps();
    if (badge) {
      if (crits.length > 0) { badge.style.display='flex'; if (badgeTxt) badgeTxt.textContent = crits.length + ' ' + t('critGaps'); }
      else badge.style.display = 'none';
    }
  }
  renderTrialCountdown();
}

  var diff = TRIAL_ENDS_AT.getTime() - Date.now();

    showTrialExpiredOverlay(); return;
  }
  hideTrialExpiredOverlay();
  var h2=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000);
  var lbl = LANG==='en'?'⏱ Trial expires in:':LANG==='fr'?'⏱ Expire dans :':'⏱ Trial expira em:';
  var ts = h2>0 ? h2+'h '+m+'min' : m+'min';
  var urgent = diff < 4*3600000;
  el.style.display='block';

function renderPS(psCode) {
  var stage = document.getElementById('stage');
  var psIdx = PS_ORDER.indexOf(psCode) + 1;
  if (isTrial() && !TRIAL_PS.includes(psCode)) {
    stage.innerHTML = renderTeaser(psCode); setNavNext(t('next')); return;
  }
  var qs = activeQuestionsForPS(psCode);
  if (!qs.length && !applicablePS().includes(psCode)) { goNext(); return; }

  var vals = ['yesE','yes','prog','no','na'];
  var html =
    '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#87948c;margin-bottom:8px">0' + (psIdx+2) + ' · ' + h(t('steps')[3]) + '</div>' +
    '<h1 style="font-family:\'Source Serif 4\',serif;font-size:24px;line-height:1.3;margin:0 0 16px;color:#e0e3e1">' + h(psName(psCode)) + '</h1>' +
    '<div style="border-left:2px solid #68dbae;padding:12px 16px;background:rgba(38,163,122,.08);margin-bottom:24px">' +
    '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#68dbae;margin-bottom:6px">' + h(t('whyWeAsk')) + '</div>' +
    '<p style="font-size:13px;color:#bccac1;line-height:1.65;margin:0">' + h(psRat(psCode)) + '</p></div>';

  if (!qs.length) {
    html += '<p style="font-size:14px;color:#87948c;text-align:center;padding:40px 0">Esta norma não se aplica ao projeto com base nas respostas de triagem.</p>';
  } else {
    html += qs.map(function(q,li){
      var gi = globalQIndex(psCode, li);
      var ans = STATE.answers[gi] || {};
      return '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:18px 20px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.3)">' +
        '<div style="margin-bottom:14px">' +
        '<span style="display:inline-block;background:#272b2a;border:1px solid #3d4943;font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.06em;color:#bccac1;padding:2px 8px;margin-bottom:10px">' +
          h(psCode) + ' · ' + h(q.ref) + (q.crit?' <span style="color:#ffb4ab">★</span>':'') +
        '</span>' +
        '<p style="font-family:\'Source Serif 4\',serif;font-size:18px;line-height:1.4;color:#e0e3e1;margin:0">' + h(q[LANG]||q.pt) + '</p>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
        vals.map(function(v){
          var ak = (T[LANG].a||T.pt.a)[v] || T.pt.a[v];
          var sel = ans.val === v;
          return '<button class="ans-btn ' + v + (sel?' selected':'') + '" onclick="setAnswer(' + gi + ',\'' + v + '\')">' +
            '<div style="flex:1">' +
              '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;font-weight:600;letter-spacing:.02em">' + h(ak.t) + '</div>' +
              (ak.s?'<div style="font-size:12px;color:#87948c;margin-top:2px">' + h(ak.s) + '</div>':'') +
            '</div>' +
            '<span class="material-symbols-outlined" style="flex-shrink:0;margin-left:12px">' + ak.icon + '</span>' +
            '</button>';
        }).join('') + '</div>' +
        (ans.val==='na'?
          '<div style="margin-top:14px"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#87948c;display:block;margin-bottom:6px">' + h(t('naReason')) + '</label>' +
          '<textarea style="width:100%;background:#0b0f0e;border:0;border-bottom:1px solid #3d4943;color:#e0e3e1;padding:8px;font-size:13px;min-height:52px;resize:vertical;font-family:Inter,system-ui,sans-serif" placeholder="…" oninput="setNote(' + gi + ',\'naReason\',this.value)">' + h(ans.naReason||'') + '</textarea></div>'
        :'') +
        '<div style="margin-top:14px"><label style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#87948c;display:block;margin-bottom:6px">' + h(t('fieldNotes')) + '</label>' +
        '<div style="position:relative"><textarea style="width:100%;background:#0b0f0e;border:0;border-bottom:1px solid #3d4943;color:#e0e3e1;padding:8px;font-size:13px;min-height:64px;resize:vertical;font-family:Inter,system-ui,sans-serif" placeholder="' + h(t('notePh')) + '" oninput="setNote(' + gi + ',\'note\',this.value)">' + h(ans.note||'') + '</textarea>' +
        '<span style="position:absolute;bottom:8px;right:8px;font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#3d4943;letter-spacing:.06em">' + t('autosave') + '</span></div></div>' +
        '</div>';
    }).join('');
  }
  stage.innerHTML = html;
  setNavNext(STEP===10 ? t('seeReport') : t('next'));
}

function renderTeaser(psCode) {
  return '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#87948c;margin-bottom:16px">' + h(psName(psCode)) + '</div>' +
    '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:40px 24px;text-align:center">' +
    '<span class="material-symbols-outlined" style="font-size:48px;color:#87948c;display:block;margin-bottom:16px">lock</span>' +
    '<h3 style="font-family:\'Source Serif 4\',serif;font-size:22px;color:#e0e3e1;margin:0 0 12px">' + h(t('teaserTitle')) + '</h3>' +
    '<p style="font-size:14px;color:#bccac1;line-height:1.6;margin:0 0 24px;max-width:42ch;margin-left:auto;margin-right:auto">' + h(t('teaserBody')) + '</p>' +
    '<a href="' + MAILTO_CTA + '" style="display:inline-flex;align-items:center;gap:8px;background:#68dbae;color:#003121;text-decoration:none;padding:12px 24px;font-family:\'IBM Plex Mono\',monospace;font-size:13px;font-weight:700;letter-spacing:.04em">' +
    '<span class="material-symbols-outlined" style="font-size:16px">mail</span>' + h(t('teaserCta')) + '</a></div>';
}

function setAnswer(gi, val) {
  if (!STATE.answers[gi]) STATE.answers[gi]={val:'',note:'',naReason:''};
  STATE.answers[gi].val = val;
  var psCode = PS_ORDER[STEP-3];
  if (psCode) renderPS(psCode);
  updateScoreHeader(); scheduleSave();
}
function setNote(gi, field, val) {
  if (!STATE.answers[gi]) STATE.answers[gi]={val:'',note:'',naReason:''};
  STATE.answers[gi][field] = val; scheduleSave();
}

/* ── Step 11: Report ───────────────────────────────────────── */
function renderReport() {
  STATE.completed = true; scheduleSave(200);
  var score = globalScore();
  var app = applicablePS();
  var locked = isTrial() ? app.filter(function(ps){ return !TRIAL_PS.includes(ps); }) : [];
  var crits = criticalGaps();
  var vk = score===null?'vBlock':score>=70?'vReady':score>=40?'vNear':'vBlock';
  var vColor = vk==='vReady'?'#68dbae':vk==='vNear'?'#E0A84B':'#ffb4ab';
  var vBg = vk==='vReady'?'rgba(38,163,122,.15)':vk==='vNear'?'rgba(224,168,75,.15)':'rgba(147,0,10,.3)';

  var html = '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#87948c;margin-bottom:20px">— ' + h(t('reportIntro')) + '</div>';

  if (isTrial() && locked.length) {
    var banner = t('partialBanner').replace('{N}', locked.length);
    html += '<div style="border:1px solid rgba(224,168,75,.4);background:rgba(224,168,75,.1);padding:14px 18px;margin-bottom:20px;font-size:13px;color:#f0cd92;line-height:1.5">' +
      '⚠ ' + h(banner) + ' <a href="' + MAILTO_CTA + '" style="color:inherit;font-weight:700">→ ' + h(t('teaserCta')) + '</a></div>';
  }

  html += '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:28px;margin-bottom:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap">' +
    '<div style="font-family:\'Source Serif 4\',serif;font-size:80px;line-height:.9;color:#68dbae">' + (score!==null?score:'—') + '<span style="font-size:32px;color:#87948c">%</span></div>' +
    '<div style="flex:1;min-width:180px">' +
    '<span style="display:inline-block;border:1px solid ' + vColor + ';background:' + vBg + ';color:' + vColor + ';font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;margin-bottom:10px">' + h(t(vk)) + '</span>' +
    '<p style="font-size:13px;color:#87948c;margin:0">' + h(t('overall')) + ' · ' + app.length + ' ' + h(t('applicable')) + '</p>' +
    '</div></div>';

  html += '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:20px;margin-bottom:16px">' +
    '<h3 style="font-size:15px;font-weight:600;margin:0 0 14px;color:#e0e3e1">' + h(t('critTitle')) + '</h3>';
  if (!crits.length) {
    html += '<div style="display:flex;align-items:center;gap:8px;color:#68dbae;font-size:14px"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>' + h(t('critNone')) + '</div>';
  } else {
    html += '<p style="font-size:12px;color:#87948c;margin:0 0 12px">' + h(t('critSub')) + '</p>' +
      crits.map(function(c){
        return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #272b2a">' +
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#ffb4ab;min-width:44px;padding-top:2px">' + h(c.ps) + '</span>' +
          '<span style="font-size:14px;color:#e0e3e1;line-height:1.5">' + h(c.text) + '</span></div>';
      }).join('');
  }
  html += '</div>';

  html += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#87948c;margin-bottom:12px">' + h(t('byStd')) + '</div>';
  html += app.map(function(ps){
    if (!entitlementAllows(ps)) return '';
    var sc = scorePS(ps);
    var qs = activeQuestionsForPS(ps);
    var scColor = sc===null?'#87948c':sc>=70?'#68dbae':sc>=40?'#E0A84B':'#ffb4ab';
    var gapItems = qs.map(function(q,li){
      var gi = globalQIndex(ps,li); var ans = STATE.answers[gi];
      if (!ans||ans.val==='yesE') return '';
      var gc = ans.val==='no'?'#ffb4ab':ans.val==='prog'?'#E0A84B':'#87948c';
      var ak = (T[LANG].a||T.pt.a)[ans.val]||T.pt.a[ans.val];
      return '<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #272b2a;font-size:13px">' +
        '<div style="width:8px;height:8px;border-radius:2px;background:' + gc + ';flex-shrink:0;margin-top:4px"></div>' +
        '<div style="flex:1;color:#e0e3e1;line-height:1.5">' + h(q[LANG]||q.pt) + (ans.note?'<div style="font-size:11px;color:#87948c;margin-top:2px">' + h(ans.note) + '</div>':'') + '</div>' +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#87948c;flex-shrink:0">' + h(ak.t) + '</span></div>';
    }).filter(Boolean).join('');
    return '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:16px 20px;margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">' +
      '<span style="font-size:13px;font-weight:600;color:#e0e3e1">' + h(psName(ps)) + '</span>' +
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:14px;font-weight:700;color:' + scColor + '">' + (sc!==null?sc+'%':'—') + '</span></div>' +
      (gapItems||'<div style="display:flex;align-items:center;gap:6px;color:#68dbae;font-size:12px"><span class="material-symbols-outlined" style="font-size:16px">check_circle</span>OK</div>') +
      '</div>';
  }).join('');

  html += '<div style="border:1px solid #3d4943;padding:14px 18px;font-size:12px;color:#87948c;line-height:1.6;margin:16px 0">' +
    '⚠ ' + (T[LANG].disclaimer||T.pt.disclaimer) + '</div>';

  var json = JSON.stringify(profileJSON(),null,2);
  html += '<div class="relative corner-accent" style="background:#1c201f;border:1px solid #3d4943;padding:18px 20px;margin-bottom:16px">' +
    '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#87948c;margin-bottom:6px">' + h(t('exportTitle')) + '</div>' +
    '<p style="font-size:12px;color:#87948c;margin:0 0 10px">' + h(t('exportSub')) + '</p>' +
    '<textarea id="json-out" readonly style="width:100%;min-height:120px;background:#0b0f0e;border:1px solid #3d4943;color:#87948c;padding:10px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;resize:vertical">' + h(json) + '</textarea>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
    '<button onclick="copyJSON()" style="display:flex;align-items:center;gap:6px;border:1px solid #3d4943;background:none;color:#bccac1;padding:10px 16px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:16px">content_copy</span>' + h(t('copy')) + '</button>' +
    '<button onclick="downloadJSON()" style="display:flex;align-items:center;gap:6px;background:#26a37a;border:none;color:#003121;padding:10px 16px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;font-weight:700;cursor:pointer"><span class="material-symbols-outlined" style="font-size:16px">download</span>' + h(t('download')) + '</button>' +
    '<button onclick="restartWizard()" style="display:flex;align-items:center;gap:6px;border:1px solid #3d4943;background:none;color:#bccac1;padding:10px 16px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:16px">restart_alt</span>' + h(t('restart')) + '</button>' +
    '</div></div>';

  document.getElementById('stage').innerHTML = html;
  setNavNext(t('restart'));
}

function copyJSON() {
  var ta = document.getElementById('json-out'); if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(function(){ showToast(t('copied')); });
}
function downloadJSON() {
  var json = JSON.stringify(profileJSON(),null,2);
  var blob = new Blob([json],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='sgas-readiness-'+(STATE.project.name||'profile')+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function restartWizard() {
  STATE={project:{name:'',sector:'',country:'',phase:'',goal:'financing'},screen:{},answers:{},completed:false};
  STEP=0; render();
}

/* ── Navigation ────────────────────────────────────────────── */
function setNavNext(label) { var el=document.getElementById('navNextLabel'); if(el)el.textContent=label; }

function goNext() {
  if (STEP===11) { restartWizard(); return; }
  if (STEP===0) STEP=1;
  else if (STEP===1) STEP=2;
  else if (STEP===2) STEP=3;
  else if (STEP>=3 && STEP<=10) {
    var next=STEP+1;
    while(next<=10){ if(applicablePS().includes(PS_ORDER[next-3]))break; next++; }
    STEP=next;
  }
  if (STEP>10) STEP=11;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function goBack() {
  if (STEP===0) return;
  if (STEP===1) STEP=0;
  else if (STEP===2) STEP=1;
  else if (STEP===3) STEP=2;
  else if (STEP>=4&&STEP<=10) STEP--;
  else if (STEP===11) STEP=10;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Render dispatcher ─────────────────────────────────────── */
function render() {
  renderProgress(); updateScoreHeader();
  if (STEP===0) renderTransparency();
  else if (STEP===1) renderIntro();
  else if (STEP===2) renderScreen();
  else if (STEP>=3&&STEP<=10) renderPS(PS_ORDER[STEP-3]);
  else if (STEP===11) renderReport();
  setSaveState('idle');
}

/* ── Toast ─────────────────────────────────────────────────── */
function showToast(msg) {
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ── Language switcher ─────────────────────────────────────── */
function switchLang(lang) {
  LANG = lang; document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    var active = b.dataset.lang === lang;
    b.style.background = active ? '#68dbae' : 'none';
    b.style.color = active ? '#003827' : '#bccac1';
    b.style.fontWeight = active ? '600' : '400';
  });
  render();
}

/* ── Boot ──────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function(){
  render();
  detectPlan().then(function(){ render(); }).catch(function(){});
  setInterval(function(){ renderTrialCountdown(); }, 60000);
});
</script>
