<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGAS Pro — Diagnóstico de Prontidão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>
:root{
  --bg:#0A1F14;--panel:#0D2E1E;--panel-2:#0F3826;
  --ink:#F4ECD8;--ink-dim:rgba(244,236,216,.62);--ink-faint:rgba(244,236,216,.40);
  --teal:#1D9E75;--teal-bright:#2BC78F;--amber:#E0A84B;--red:#D9645A;
  --line:rgba(244,236,216,.09);--line-2:rgba(244,236,216,.16);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;line-height:1.5}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
button{font-family:inherit;cursor:pointer}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.card::before,.card::after{content:"";position:absolute;width:8px;height:8px}
.card::before{top:-1px;left:-1px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.card::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:rgba(10,31,20,.92);backdrop-filter:blur(8px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:2px;background:var(--teal);box-shadow:0 0 0 3px rgba(29,158,117,.18)}
.brand b{letter-spacing:.04em;font-weight:600}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{background:none;border:none;color:var(--ink-dim);font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:5px 11px;border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--teal);color:#04140C;font-weight:500}
.back-link{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:12px;text-decoration:none;font-family:var(--mono);letter-spacing:.04em}
.back-link:hover{color:var(--ink)}

.wrap{max-width:1080px;margin:0 auto;padding:30px 24px 80px}
.stage-grid{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
@media(max-width:860px){.stage-grid{grid-template-columns:1fr}.rail{order:-1}}

.progress{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.progress .seg{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:8px}
.progress .seg.active{color:var(--teal-bright)}
.progress .seg.done{color:var(--ink-dim)}
.progress .sep{color:var(--ink-faint)}

h1.q{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.18;margin:6px 0 4px;letter-spacing:.01em}
@media(max-width:560px){h1.q{font-size:27px}}
.lead{color:var(--ink-dim);font-size:15px;max-width:60ch}
.panel-pad{padding:30px 32px}
@media(max-width:560px){.panel-pad{padding:22px 20px}}

/* Transparency screen */
.why-block{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.why-item{border:1px solid var(--line);border-radius:4px;padding:18px 20px;background:var(--panel-2)}
.why-item .why-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.why-item p{margin:0;font-size:13.5px;color:var(--ink-dim);line-height:1.6}

/* Rationale tooltip */
.ps-rationale{margin-bottom:20px;padding:14px 16px;border-left:2px solid var(--teal);background:rgba(29,158,117,.06);border-radius:0 4px 4px 0;font-size:13px;color:var(--ink-dim);line-height:1.6}
.ps-rationale .ps-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.help{margin-top:14px;padding:12px 14px;border-left:2px solid var(--line-2);background:rgba(244,236,216,.025);font-size:13px;color:var(--ink-dim);border-radius:0 4px 4px 0}
.help .ref{font-family:var(--mono);font-size:10.5px;color:var(--teal);letter-spacing:.06em}

.answers{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:15px 16px;border-radius:4px;transition:border-color .15s,background .15s,transform .05s}
.ans:hover{border-color:var(--line-2)}
.ans:active{transform:translateY(1px)}
.ans .glyph{width:26px;height:26px;flex:none;border-radius:3px;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;border:1px solid var(--line-2);color:var(--ink-dim)}
.ans .txt{flex:1}
.ans .txt b{display:block;font-weight:500;font-size:14.5px}
.ans .txt span{font-size:12px;color:var(--ink-faint)}
.ans[aria-pressed="true"]{border-color:var(--teal);background:rgba(29,158,117,.10)}
.ans[aria-pressed="true"] .glyph{background:var(--teal);color:#04140C;border-color:var(--teal)}
.ans.k-prog[aria-pressed="true"]{border-color:var(--amber);background:rgba(224,168,75,.10)}
.ans.k-prog[aria-pressed="true"] .glyph{background:var(--amber);color:#1a1206}
.ans.k-no[aria-pressed="true"]{border-color:var(--red);background:rgba(217,100,90,.10)}
.ans.k-no[aria-pressed="true"] .glyph{background:var(--red);color:#1a0606}
.ans.k-na[aria-pressed="true"]{border-color:var(--line-2);background:rgba(244,236,216,.05)}
.ans.k-na[aria-pressed="true"] .glyph{background:var(--ink-faint);color:#04140C}

.note{margin-top:14px}
.note label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.note textarea{width:100%;min-height:52px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:10px 12px;font-family:var(--sans);font-size:13px}
.note textarea:focus{outline:none;border-color:var(--teal)}

.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:none;color:var(--ink);padding:11px 20px;border-radius:4px;font-size:13.5px;font-weight:500;letter-spacing:.01em}
.btn:hover{border-color:var(--ink-dim)}
.btn.primary{background:var(--teal);color:#04140C;border-color:var(--teal);font-weight:600}
.btn.primary:hover{background:var(--teal-bright)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent;color:var(--ink-dim);padding-left:4px}

/* Intro fields */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:12px 13px;font-family:var(--sans);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal)}
.field select option{background:#0D2E1E}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
@media(max-width:560px){.goal-grid{grid-template-columns:1fr}}
.goal-btn{text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:16px}
.goal-btn[aria-pressed="true"]{border-color:var(--teal);background:rgba(29,158,117,.10)}
.goal-btn b{display:block;font-weight:600;margin-bottom:4px}
.goal-btn span{font-size:12.5px;color:var(--ink-dim)}

/* Trial teaser */
.teaser{margin-top:24px;border:1px dashed var(--line-2);border-radius:6px;padding:28px;text-align:center}
.teaser .lock{font-size:32px;margin-bottom:12px}
.teaser h3{margin:0 0 8px;font-size:18px;font-weight:600}
.teaser p{margin:0 0 18px;font-size:13.5px;color:var(--ink-dim);max-width:44ch;margin-left:auto;margin-right:auto}
.teaser a.cta{display:inline-block;padding:10px 22px;background:var(--teal);color:#04140C;border-radius:4px;font-weight:700;font-size:13px;text-decoration:none}
.teaser a.cta:hover{background:var(--teal-bright)}

/* Rail */
.rail{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px}
.meter{padding:20px}
.meter .num{font-family:var(--serif);font-size:52px;line-height:1;letter-spacing:.01em}
.meter .num small{font-size:20px;color:var(--ink-faint)}
.bar{height:6px;border-radius:3px;background:rgba(244,236,216,.08);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));transition:width .4s ease}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:12px}
.legend .row{display:flex;align-items:center;justify-content:space-between;color:var(--ink-dim)}
.legend .row .l{display:flex;align-items:center;gap:8px}
.pip{width:9px;height:9px;border-radius:2px}
.scope{padding:18px 20px}
.scope h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 12px}
.scope .ps-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:12.5px}
.scope .ps-row:last-child{border-bottom:none}
.scope .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.tag.in{color:var(--teal-bright);border:1px solid rgba(43,199,143,.4)}
.tag.out{color:var(--ink-faint);border:1px solid var(--line)}
.tag.locked{color:var(--amber);border:1px solid rgba(224,168,75,.4)}
.disc{font-size:11px;color:var(--ink-faint);line-height:1.5;border-top:1px solid var(--line);padding:14px 20px}

/* Report */
.report-hero{padding:30px 32px;display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.big-score{font-family:var(--serif);font-size:84px;line-height:.9}
.big-score small{font-size:30px;color:var(--ink-faint)}
.verdict{flex:1;min-width:240px}
.verdict .label{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.v-block{background:rgba(217,100,90,.12);color:#f0a59d;border:1px solid rgba(217,100,90,.3)}
.v-near{background:rgba(224,168,75,.12);color:#f0cd92;border:1px solid rgba(224,168,75,.3)}
.v-ready{background:rgba(43,199,143,.12);color:#9fe7cb;border:1px solid rgba(43,199,143,.3)}
.partial-banner{margin:0 0 18px;padding:14px 18px;background:rgba(224,168,75,.10);border:1px solid rgba(224,168,75,.3);border-radius:4px;font-size:13px;color:#f0cd92}
.crit-list{margin-top:6px}
.crit-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.crit-ps{font-family:var(--mono);font-size:10px;color:var(--red);flex:none;width:54px;letter-spacing:.05em;padding-top:2px}
.psblock{margin-top:14px;padding:18px 22px}
.psblock h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.psblock h3 .pct{font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.gap{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13px}
.gap:last-child{border-bottom:none}
.gap .gst{flex:none;width:8px;height:8px;border-radius:2px;margin-top:5px}
.gap .gtxt{flex:1}
.gap .gnote{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:2px}
.export-card{padding:18px 22px}
.export-card textarea{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);border-radius:4px;padding:12px;font-family:var(--mono);font-size:11px;resize:vertical}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--teal);color:#04140C;font-weight:600;font-size:13px;padding:11px 20px;border-radius:6px;transition:.25s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block;margin-left:8px;transition:background .3s}
.save-dot.saving{background:var(--amber)}
.save-dot.saved{background:var(--teal)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--teal-bright);outline-offset:2px}
</style>
</head>

<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <b>SGAS&nbsp;PRO</b>&nbsp;
      <span class="sub" id="brandSub">Diagnóstico de Prontidão</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="save-dot" id="saveDot" title=""></span>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="pt" aria-pressed="true">PT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
    <a href="/sgas-pro.html" class="back-link">← App</a>
  </div>
</header>

<div class="wrap">
  <div class="progress" id="progress"></div>
  <div class="stage-grid">
    <main id="stage" class="card panel-pad" aria-live="polite"></main>
    <aside class="rail">
      <div class="card meter">
        <div class="eyebrow" id="meterLabel">Prontidão estimada</div>
        <div class="num"><span id="meterNum">—</span><small id="meterPct"></small></div>
        <div class="bar"><i id="meterBar" style="width:0%"></i></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card scope">
        <h4 id="scopeLabel">Âmbito aplicável</h4>
        <div id="scopeList"></div>
      </div>
      <div class="disc" id="disclaimer"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ── Trial gating ────────────────────────────────────────── */
var TRIAL_PS = ['PS1','PS2','PS3'];
var MAILTO_CTA = 'mailto:geral@hsilva.org?subject=SGAS%20Pro%20%E2%80%94%20upgrade%20plano%20completo';

/* ── State ───────────────────────────────────────────────── */
var LANG = 'pt';
var STEP = 0; // 0=transparency, 1=project, 2=screening, 3-10=PS1-PS8, 11=report
var PLAN = 'trial'; // 'trial' | 'paid'
var STATE = {
  project: {name:'',sector:'',country:'',phase:'',goal:'financing'},
  screen: {},   // {sc5: true/false, sc6: true/false, sc7: true/false, sc8: true/false}
  answers: {},  // {qIdx: {val:'yesE'|'yes'|'prog'|'no'|'na', note:'', naReason:''}}
  completed: false
};

/* PS ordering for steps 3–10 */
var PS_ORDER = ['PS1','PS2','PS3','PS4','PS5','PS6','PS7','PS8'];

/* ── Supabase client ─────────────────────────────────────── */
var _sb = null;
function getClient() {
  if (window.SGAS_AUTH && window.SGAS_AUTH.client) return window.SGAS_AUTH.client;
  if (_sb) return _sb;
  if (!window.supabase || !window.supabase.createClient) return null;
  var cfg = window.SGAS_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return null;
  _sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  return _sb;
}

async function detectPlan() {
  try {
    var sb = getClient();
    if (!sb) return;
    var session = (await sb.auth.getSession()).data.session;
    if (!session) return;

    var memRes = await sb
      .from('organization_members')
      .select('organization_id, organizations(trial_ends_at, entitlement)')
      .eq('user_id', session.user.id)
      .is('suspended_at', null)
      .limit(1)
      .maybeSingle();

    if (memRes.data && memRes.data.organizations) {
      var org = memRes.data.organizations;
      // If entitlement field exists and is 'paid', unlock all
      if (org.entitlement === 'paid') { PLAN = 'paid'; return; }
      // Otherwise derive from trial_ends_at: null = paid, set = trial
      if (!org.trial_ends_at) { PLAN = 'paid'; } else { PLAN = 'trial'; }
    }
  } catch (_) { /* default to trial — safe fallback */ }
}

/* ── Helpers ─────────────────────────────────────────────── */
function t(key) { return T[LANG][key] || T.pt[key] || key; }
function psName(code) { return PS[code][LANG] || PS[code].pt; }
function psRationale(code) { return PS_RATIONALE[code][LANG] || PS_RATIONALE[code].pt; }
function h(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isTrial() { return PLAN !== 'paid'; }
function entitlementAllows(ps) { return !isTrial() || TRIAL_PS.includes(ps); }

function activeQuestions() {
  return Q.filter(function(q) {
    if (q.cond && !STATE.screen[q.cond]) return false;
    return true;
  });
}

function activeQuestionsForPS(ps) {
  return activeQuestions().filter(function(q) { return q.ps === ps; });
}

function applicablePS() {
  // PS1–PS4 always in scope; PS5/6/7/8 gated by screening
  var always = ['PS1','PS2','PS3','PS4'];
  var conditional = [
    {ps:'PS5', sc:'sc5'}, {ps:'PS6', sc:'sc6'},
    {ps:'PS7', sc:'sc7'}, {ps:'PS8', sc:'sc8'}
  ];
  var result = always.slice();
  conditional.forEach(function(c) { if (STATE.screen[c.sc]) result.push(c.ps); });
  return result;
}

function globalQIndex(ps, localIdx) {
  var all = activeQuestions();
  var count = 0;
  for (var i = 0; i < all.length; i++) {
    if (all[i].ps === ps) { if (count === localIdx) return i; count++; }
  }
  return -1;
}

/* ── Scoring ─────────────────────────────────────────────── */
function scoreVal(val) {
  if (val === 'yesE') return 1.0;
  if (val === 'yes')  return 0.7;
  if (val === 'prog') return 0.3;
  if (val === 'no')   return 0.0;
  return null; // na or unanswered
}

function scorePS(ps) {
  var qs = activeQuestionsForPS(ps);
  if (!qs.length) return null;
  var scored = [], total = 0;
  qs.forEach(function(q, li) {
    var gi = globalQIndex(ps, li);
    var ans = STATE.answers[gi];
    var s = ans ? scoreVal(ans.val) : null;
    if (s !== null) { scored.push(s); total += s; }
  });
  if (!scored.length) return null;
  return Math.round((total / scored.length) * 100);
}

function globalScore() {
  var app = applicablePS().filter(entitlementAllows);
  var scores = [], total = 0;
  app.forEach(function(ps) {
    var s = scorePS(ps);
    if (s !== null) { scores.push(s); total += s; }
  });
  if (!scores.length) return null;
  return Math.round(total / scores.length);
}

function criticalGaps() {
  var gaps = [];
  var qs = activeQuestions();
  qs.forEach(function(q, gi) {
    if (!q.crit) return;
    if (!entitlementAllows(q.ps)) return;
    var ans = STATE.answers[gi];
    var s = ans ? scoreVal(ans.val) : 0;
    if (s === null) return;
    if (s < 1.0) gaps.push({ps: q.ps, ref: q.ref, text: q[LANG] || q.pt, val: ans ? ans.val : 'no'});
  });
  return gaps;
}

function profileJSON() {
  var app = applicablePS();
  return {
    wizard_version: '1.0',
    plan: PLAN,
    lang: LANG,
    assessed_at: new Date().toISOString(),
    project: STATE.project,
    applicable_standards: app,
    screened_out: PS_ORDER.filter(function(p) { return !app.includes(p); }),
    screen_answers: STATE.screen,
    score: globalScore(),
    scores_by_ps: (function(){
      var out = {};
      app.forEach(function(ps) { out[ps] = entitlementAllows(ps) ? scorePS(ps) : null; });
      return out;
    })(),
    critical_gaps: criticalGaps(),
    answers: STATE.answers,
    status: STATE.completed ? 'complete' : 'partial'
  };
}

/* ── Supabase persistence ────────────────────────────────── */
var _saveTimer = null;
function scheduleSave(delay) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveAssessment, delay || 1500);
}

async function saveAssessment() {
  var sb = getClient();
  if (!sb) return;
  try {
    setSaveDot('saving');
    var session = (await sb.auth.getSession()).data.session;
    if (!session) { setSaveDot(''); return; }

    // Get org + project
    var memRes = await sb
      .from('organization_members')
      .select('organization_id')
      .eq('user_id', session.user.id)
      .is('suspended_at', null)
      .limit(1)
      .maybeSingle();

    if (!memRes.data) { setSaveDot(''); return; }
    var orgId = memRes.data.organization_id;

    // Get active project
    var projId = (typeof ACTIVE_PROJECT_ID !== 'undefined' && ACTIVE_PROJECT_ID)
      ? ACTIVE_PROJECT_ID
      : localStorage.getItem('sgas_project_id');

    var profile = profileJSON();
    var payload = {
      org_id: orgId,
      project_id: projId || null,
      plan: PLAN,
      lang: LANG,
      status: STATE.completed ? 'complete' : 'partial',
      score: profile.score,
      applicable_standards: profile.applicable_standards,
      critical_gaps: profile.critical_gaps,
      answers: STATE.answers,
      profile: profile,
      updated_at: new Date().toISOString()
    };

    // Upsert by org_id + lang (one active assessment per org per language)
    var res = await sb
      .from('readiness_assessments')
      .upsert(payload, { onConflict: 'org_id,lang', ignoreDuplicates: false });

    if (res.error && res.error.code !== '42P01') {
      console.warn('[SGAS Wizard] Save error:', res.error.message);
      setSaveDot('');
    } else {
      setSaveDot('saved');
      setTimeout(function() { setSaveDot(''); }, 3000);
      // Update projectConfig in sgas-pro.html if available
      updateProjectConfig(profile);
    }
  } catch (e) {
    console.warn('[SGAS Wizard] Save exception:', e.message);
    setSaveDot('');
  }
}

function updateProjectConfig(profile) {
  // If wizard is embedded or opened alongside sgas-pro.html, update shared state
  if (window.opener && window.opener.ACTIVE_PROJECT_ID) {
    try {
      var sb = getClient();
      if (!sb || !window.opener.ACTIVE_PROJECT_ID) return;
      sb.from('projects').update({
        metadata: {
          readiness_score: profile.score,
          applicable_standards: profile.applicable_standards,
          critical_gaps: profile.critical_gaps,
          last_assessment_at: profile.assessed_at
        }
      }).eq('id', window.opener.ACTIVE_PROJECT_ID).then(function(){});
    } catch(_){}
  }
}

function setSaveDot(state) {
  var dot = document.getElementById('saveDot');
  if (!dot) return;
  dot.className = 'save-dot' + (state ? ' ' + state : '');
  dot.title = state === 'saving' ? 'A guardar…' : state === 'saved' ? 'Guardado' : '';
}

/* ── Progress bar ────────────────────────────────────────── */
function renderProgress() {
  var steps = t('steps');
  // Map STEP to segment: 0→0, 1→1, 2→2, 3-10→3, 11→4
  var seg = STEP === 0 ? 0 : STEP === 1 ? 1 : STEP === 2 ? 2 : STEP <= 10 ? 3 : 4;
  var html = steps.map(function(s, i) {
    var cls = i < seg ? 'seg done' : i === seg ? 'seg active' : 'seg';
    return '<span class="' + cls + '">' + h(s) + '</span>' +
      (i < steps.length-1 ? '<span class="sep">···</span>' : '');
  }).join('');
  document.getElementById('progress').innerHTML = html;
}

/* ── Rail (meter + scope) ────────────────────────────────── */
function renderRail() {
  var score = globalScore();
  var mNum = document.getElementById('meterNum');
  var mPct = document.getElementById('meterPct');
  var mBar = document.getElementById('meterBar');
  document.getElementById('meterLabel').textContent = t('meter');

  if (score === null) {
    mNum.textContent = '—'; mPct.textContent = ''; mBar.style.width = '0%';
  } else {
    mNum.textContent = score; mPct.textContent = '%';
    mBar.style.width = score + '%';
  }

  // Legend
  var counts = {ev:0,claim:0,prog:0,miss:0};
  activeQuestions().forEach(function(q, gi) {
    if (!entitlementAllows(q.ps)) return;
    var ans = STATE.answers[gi];
    if (!ans) { counts.miss++; return; }
    if (ans.val === 'yesE') counts.ev++;
    else if (ans.val === 'yes') counts.claim++;
    else if (ans.val === 'prog') counts.prog++;
    else if (ans.val === 'no') counts.miss++;
  });
  var lbl = t('legend');
  var colors = {ev:'#2BC78F',
                claim:'rgba(244,236,216,.4)',prog:'#E0A84B',miss:'#D9645A'};
  document.getElementById('legend').innerHTML = Object.keys(counts).map(function(k) {
    return '<div class="row"><span class="l"><span class="pip" style="background:' + colors[k] + '"></span>' +
      lbl[k] + '</span><span>' + counts[k] + '</span></div>';
  }).join('');

  // Scope list
  document.getElementById('scopeLabel').textContent = t('scope');
  var app = STEP >= 3 ? applicablePS() : PS_ORDER;
  var html = PS_ORDER.map(function(ps) {
    var inScope = app.includes(ps);
    var locked = isTrial() && !TRIAL_PS.includes(ps);
    var tagCls = locked ? 'tag locked' : inScope ? 'tag in' : 'tag out';
    var tagTxt = locked ? t('locked') : inScope ? t('in') : t('out');
    return '<div class="ps-row"><span style="font-size:12px">' + h(PS[ps][LANG].split('·')[0].trim()) +
      '</span><span class="' + tagCls + '">' + tagTxt + '</span></div>';
  }).join('');
  document.getElementById('scopeList').innerHTML = html;

  document.getElementById('disclaimer').innerHTML = T[LANG].disclaimer;
}

  if (isTrial() && !TRIAL_PS.includes(psCode)) {
    stage.innerHTML = renderTeaser(psCode);
    renderNavRow(stage, true);
    return;
  }

  var qs = activeQuestionsForPS(psCode);
  if (!qs.length && !applicablePS().includes(psCode)) {
    // Screened out — skip to next
    goNext(); return;
  }

  var html =
    '<div class="eyebrow" style="margin-bottom:6px">0' + (psIdx+2) + ' · ' + h(t('steps')[3]) + '</div>' +
    '<h1 class="q" style="font-size:22px;margin-bottom:14px">' + h(psName(psCode)) + '</h1>' +
    '<div class="ps-rationale"><div class="ps-label">Porque perguntamos isto</div>' + h(psRationale(psCode)) + '</div>';

  if (!qs.length) {
    html += '<p style="color:var(--ink-dim);font-size:14px">Esta norma não se aplica ao seu projeto com base nas respostas de triagem.</p>';
  } else {
    html += qs.map(function(q, li) {
      var gi = globalQIndex(psCode, li);
      var ans = STATE.answers[gi] || {};
      var vals = ['yesE','yes','prog','no','na'];
      var classes = {yesE:'ans k-yesE',yes:'ans',prog:'ans k-prog',no:'ans k-no',na:'ans k-na'};
      var glyphs = {yesE:'✓',yes:'○',prog:'◑',no:'✗',na:'—'};
      return '<div style="margin-bottom:20px">' +
        '<p style="font-size:15px;line-height:1.5;margin:0 0 4px">' + h(q[LANG] || q.pt) + (q.crit ? ' <span style="color:var(--red);font-size:11px">★</span>' : '') + '</p>' +
        '<div class="help"><span class="ref">' + h(q.ref) + '</span></div>' +
        '<div class="answers">' +
        vals.map(function(v) {
          var ak = T[LANG].a[v] || T.pt.a[v];
          return '<button class="' + classes[v] + '" aria-pressed="' + (ans.val===v) + '" onclick="setAnswer(' + gi + ',\'' + v + '\')">' +
            '<span class="glyph">' + glyphs[v] + '</span>' +
            '<span class="txt"><b>' + h(ak.t) + '</b>' + (ak.s ? '<span>' + h(ak.s) + '</span>' : '') + '</span>' +
            '</button>';
        }).join('') +
        '</div>' +
        (ans.val === 'na' ?
          '<div class="note"><label>' + h(t('naReason')) + '</label>' +
          '<textarea rows="2" placeholder="…" oninput="setNote(' + gi + ',\'naReason\',this.value)">' + h(ans.naReason||'') + '</textarea></div>'
        : '') +
        '<div class="note"><label>' + h(t('notePh')) + '</label>' +
        '<textarea rows="2" placeholder="…" oninput="setNote(' + gi + ',\'note\',this.value)">' + h(ans.note||'') + '</textarea></div>' +
        '</div>';
    }).join('');
  }

  stage.innerHTML = html;
  renderNavRow(stage, false);
}

function renderTeaser(psCode) {
  return '<div class="eyebrow" style="margin-bottom:6px">' + h(psName(psCode)) + '</div>' +
    '<div class="teaser">' +
    '<div class="lock">🔒</div>' +
    '<h3>' + h(t('teaserTitle')) + '</h3>' +
    '<p>' + h(t('teaserBody')) + '</p>' +
    '<a class="cta" href="' + MAILTO_CTA + '">' + h(t('teaserCta')) + '</a>' +
    '</div>';
}

function renderNavRow(stage, isTeaser) {
  var nav = document.createElement('div');
  nav.className = 'navrow';
  nav.innerHTML =
    '<button class="btn ghost" onclick="goBack()">← ' + h(t('back')) + '</button>' +
    (STEP === 10 ?
      '<button class="btn primary" onclick="goNext()">' + h(t('seeReport')) + '</button>' :
      '<button class="btn primary" onclick="goNext()">' + h(t('next')) + '</button>');
  stage.appendChild(nav);
}

function setAnswer(gi, val) {
  if (!STATE.answers[gi]) STATE.answers[gi] = {val:'', note:'', naReason:''};
  STATE.answers[gi].val = val;
  // Re-render current PS step to update selection styles + na fields
  var psCode = PS_ORDER[STEP - 3];
  if (psCode) renderPS(psCode);
  renderRail();
  scheduleSave();
}

function setNote(gi, field, val) {
  if (!STATE.answers[gi]) STATE.answers[gi] = {val:'', note:'', naReason:''};
  STATE.answers[gi][field] = val;
  scheduleSave();
}

/* ── Step 11: Report ─────────────────────────────────────── */
function renderReport() {
  STATE.completed = true;
  scheduleSave(200);

  var score = globalScore();
  var app = applicablePS();
  var locked = isTrial() ? app.filter(function(ps) { return !TRIAL_PS.includes(ps); }) : [];
  var crits = criticalGaps();
  var verdictKey = score === null ? 'vBlock' : score >= 70 ? 'vReady' : score >= 40 ? 'vNear' : 'vBlock';
  var vCls = verdictKey === 'vReady' ? 'v-ready' : verdictKey === 'vNear' ? 'v-near' : 'v-block';

  var html =
    '<div class="eyebrow" style="margin-bottom:6px">— ' + h(t('reportIntro')) + '</div>';

  // Partial banner
  if (isTrial() && locked.length) {
    var banner = t('partialBanner').replace('{N}', locked.length);
    html += '<div class="partial-banner">⚠ ' + h(banner) + ' <a href="' + MAILTO_CTA + '" style="color:inherit;font-weight:700">→ ' + h(t('teaserCta')) + '</a></div>';
  }

  // Hero score
  html +=
    '<div class="report-hero">' +
    '<div class="big-score">' + (score !== null ? score : '—') + '<small>%</small></div>' +
    '<div class="verdict">' +
    '<span class="label ' + vCls + '">' + h(t(verdictKey)) + '</span>' +
    '<p style="font-size:13.5px;color:var(--ink-dim);margin:8px 0 0">' + h(t('overall')) + ' · ' +
    (isTrial() ? 'PS1–PS3' : app.length + ' ' + h(t('applicable'))) + '</p>' +
    '</div></div>';

  // Critical blockers
  html += '<div class="card psblock" style="margin-top:14px">' +
    '<h3>' + h(t('critTitle')) + '</h3>';
  if (!crits.length) {
    html += '<p style="font-size:13px;color:var(--teal)">' + h(t('critNone')) + '</p>';
  } else {
    html += '<p style="font-size:12.5px;color:var(--ink-faint);margin:4px 0 10px">' + h(t('critSub')) + '</p>';
    html += '<div class="crit-list">' + crits.map(function(c) {
      return '<div class="crit-item"><span class="crit-ps">' + h(c.ps) + '</span>' +
        '<span>' + h(c.text) + '</span></div>';
    }).join('') + '</div>';
  }
  html += '</div>';

  // Detail by PS
  html += '<div style="margin-top:14px">' +
    '<div class="eyebrow" style="margin-bottom:10px">' + h(t('byStd')) + '</div>' +
    app.map(function(ps) {
      if (!entitlementAllows(ps)) return ''; // skip locked in trial
      var sc = scorePS(ps);
      var qs = activeQuestionsForPS(ps);
      var color = sc === null ? 'var(--ink-faint)' : sc >= 70 ? 'var(--teal)' : sc >= 40 ? 'var(--amber)' : 'var(--red)';
      var gapItems = qs.map(function(q, li) {
        var gi = globalQIndex(ps, li);
        var ans = STATE.answers[gi];
        if (!ans || ans.val === 'yesE') return '';
        var gcolor = ans.val === 'no' ? 'var(--red)' : ans.val === 'prog' ? 'var(--amber)' : 'var(--ink-faint)';
        return '<div class="gap"><span class="gst" style="background:' + gcolor + '"></span>' +
          '<span class="gtxt">' + h(q[LANG] || q.pt) +
          (ans.note ? '<span class="gnote">' + h(ans.note) + '</span>' : '') + '</span>' +
          '<span class="gstate">' + h((T[LANG].a[ans.val]||T.pt.a[ans.val]).t) + '</span></div>';
      }).filter(Boolean).join('');
      return '<div class="card psblock" style="margin-bottom:10px">' +
        '<h3>' + h(psName(ps)) + '<span class="pct" style="color:' + color + '">' + (sc!==null?sc+'%':'—') + '</span></h3>' +
        (gapItems || '<p style="font-size:12.5px;color:var(--teal);margin:4px 0">✓</p>') +
        '</div>';
    }).join('') + '</div>';

  // Legal disclaimer (always visible in report)
  html += '<div style="margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink-faint);line-height:1.6">' +
    '⚠ ' + (T[LANG].disclaimer || T.pt.disclaimer) + '</div>';

  // JSON export
  var json = JSON.stringify(profileJSON(), null, 2);
  html +=
    '<div class="card export-card" style="margin-top:18px">' +
    '<div class="eyebrow" style="margin-bottom:6px">' + h(t('exportTitle')) + '</div>' +
    '<p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 10px">' + h(t('exportSub')) + '</p>' +
    '<textarea id="json-out" readonly>' + h(json) + '</textarea>' +
    '<div class="navrow" style="margin-top:12px">' +
    '<button class="btn ghost" onclick="goBack()">← ' + h(t('back')) + '</button>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn" onclick="copyJSON()">' + h(t('copy')) + '</button>' +
    '<button class="btn primary" onclick="downloadJSON()">' + h(t('download')) + '</button>' +
    '<button class="btn" onclick="restartWizard()">' + h(t('restart')) + '</button>' +
    '</div></div></div>';

  document.getElementById('stage').innerHTML = html;
}

function copyJSON() {
  var ta = document.getElementById('json-out');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(function() { showToast(t('copied')); });
}

function downloadJSON() {
  var json = JSON.stringify(profileJSON(), null, 2);
  var blob = new Blob([json], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'sgas-readiness-' + (STATE.project.name || 'profile') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 2000);
}

function restartWizard() {
  STATE = {project:{name:'',sector:'',country:'',phase:'',goal:'financing'},screen:{},answers:{},completed:false};
  STEP = 0;
  render();
}

/* ── Navigation ──────────────────────────────────────────── */
function goNext() {
  if (STEP === 0) { STEP = 1; }
  else if (STEP === 1) { STEP = 2; }
  else if (STEP === 2) { STEP = 3; }
  else if (STEP >= 3 && STEP <= 10) {
    // Skip PS steps where PS is not in scope AND not a trial teaser
    var nextStep = STEP + 1;
    while (nextStep <= 10) {
      var nextPS = PS_ORDER[nextStep - 3];
      var inScope = applicablePS().includes(nextPS);
      var isGated = isTrial() && !TRIAL_PS.includes(nextPS);
      if (inScope || isGated) break;
      nextStep++;
    }
    STEP = nextStep;
  } else if (STEP === 11) { return; }

  if (STEP > 10) STEP = 11;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function goBack() {
  if (STEP === 0) return;
  if (STEP === 1) { STEP = 0; }
  else if (STEP === 2) { STEP = 1; }
  else if (STEP === 3) { STEP = 2; }
  else if (STEP >= 4 && STEP <= 10) { STEP--; }
  else if (STEP === 11) { STEP = 10; }
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ── Main render dispatcher ─────────────────────────────── */
function render() {
  renderProgress();
  renderRail();
  if (STEP === 0) renderTransparency();
  else if (STEP === 1) renderIntro();
  else if (STEP === 2) renderScreen();
  else if (STEP >= 3 && STEP <= 10) renderPS(PS_ORDER[STEP - 3]);
  else if (STEP === 11) renderReport();
}

/* ── Toast ───────────────────────────────────────────────── */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ── Language switcher ───────────────────────────────────── */
document.querySelectorAll('.langs button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    LANG = btn.dataset.lang;
    document.querySelectorAll('.langs button').forEach(function(b) {
      b.setAttribute('aria-pressed', b.dataset.lang === LANG);
    });
    document.documentElement.lang = LANG;
    render();
  });
});

/* ── Boot ────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  render(); // render immediately with default plan (trial)
  detectPlan().then(function() { render(); }).catch(function() { /* already rendered */ });
});
</script>
